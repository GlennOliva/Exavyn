<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo_exavyn.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Exavyn is a secure assessment platform with monitored exam sessions, server-verified answers, and controlled result release."
    />
    <meta name="application-name" content="Exavyn" />
    <meta name="apple-mobile-web-app-title" content="Exavyn" />
    <meta name="theme-color" content="#080B14" />
    <title>Exavyn — Secure assessment platform</title>
    <script>
      // Apply the correct surface before first paint. Public auth screens are
      // always dark and must not read, change, or persist the signed-in theme
      // preference. Keep the paths and storage key in sync with src/lib/theme.ts.
      (function () {
        try {
          var root = document.documentElement;
          var path = window.location.pathname.replace(/\/+$/, '') || '/';
          var isPublic =
            path === '/login' ||
            path === '/register' ||
            path === '/forgot-password' ||
            path === '/update-password';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (isPublic) {
            root.setAttribute('data-theme', 'dark');
            root.setAttribute('data-surface', 'public');
            root.style.colorScheme = 'dark';
            if (meta) meta.setAttribute('content', '#080B14');
            return;
          }
          var stored = window.localStorage.getItem('exavyn.theme');
          var mode =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var resolved =
            mode === 'system'
              ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode;
          root.setAttribute('data-theme', resolved);
          root.setAttribute('data-surface', 'app');
          root.style.colorScheme = resolved;
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#080B14' : '#F2F5F7');
        } catch (error) {
          /* fall back to the light defaults baked into the stylesheet */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
