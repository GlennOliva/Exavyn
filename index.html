<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo_exavyn.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Exavyn — focused exams, clear results. Fullscreen-monitored exams with an automatic violation policy and immutable final scores."
    />
    <meta name="application-name" content="Exavyn" />
    <meta name="apple-mobile-web-app-title" content="Exavyn" />
    <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <title>Exavyn — Focused exams. Clear results.</title>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash
      // of the wrong theme. Keep the storage key in sync with
      // src/lib/theme.ts (THEME_STORAGE_KEY).
      (function () {
        try {
          var stored = window.localStorage.getItem('exavyn.theme');
          var mode =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var resolved =
            mode === 'system'
              ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode;
          var root = document.documentElement;
          root.setAttribute('data-theme', resolved);
          root.style.colorScheme = resolved;
        } catch (error) {
          /* fall back to the light defaults baked into the stylesheet */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
